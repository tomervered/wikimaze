# Rebuilds the add-on's lists every three hours and publishes them to the
# `data` branch, which the add-on reads (src/snapshot.js). The branch holds
# one commit that each run replaces, so it never grows.
name: Build list snapshot

on:
  schedule:
    - cron: '23 */3 * * *'
  push:
    branches: [main]
    paths: ['src/**', 'scripts/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch the previous snapshot
        run: |
          git fetch --depth=1 origin data || true
          mkdir -p previous
          git archive FETCH_HEAD snapshot 2>/dev/null | tar -x -C previous --strip-components=1 || true
      - name: Build
        env:
          PREVIOUS_DIR: previous
          SNAPSHOT_URL: 'off'
          HTTP_TIMEOUT_SCALE: '4'
        run: node scripts/build-snapshot.js out/snapshot en he
      - name: Publish to the data branch
        run: |
          cd out
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshot
          git commit -q -m "List snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
